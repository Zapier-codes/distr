# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Zapier-codes fleet front door (Storeapp Track f, leaf f.x): build the community edition and publish it to
# ghcr.io/zapier-codes/distr, then tell Render to pull it. Separate from build-distr.yaml on purpose: that file is
# the upstream project's pipeline (its own registries, Sentry, license keys, Helm test) and is left untouched.
name: Publish to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docker-autoheal/**'
      - 'sdk/**'
  workflow_dispatch:

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

env:
  # GHCR rejects upper-case repository names, and this repo's path has one (Zapier-codes).
  IMAGE: ghcr.io/zapier-codes/distr

jobs:
  publish:
    name: Build and publish (community, linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache-dependency-path: |
            go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Generate commit hash
        id: hash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies with pnpm
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build:community

      - name: Build application (amd64)
        run: go build -ldflags="$LDFLAGS" -o dist/distr-amd64 ./cmd/distr/
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          LDFLAGS: >-
            -X github.com/distr-sh/distr/internal/buildconfig.version=deploy-${{ steps.hash.outputs.sha_short }}
            -X github.com/distr-sh/distr/internal/buildconfig.commit=${{ steps.hash.outputs.sha_short }}
            -X github.com/distr-sh/distr/internal/buildconfig.edition=community

      # Dockerfile.distr copies dist/*.spdx.json, so at least one file must exist.
      - name: Generate SBOM for frontend project
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: pnpm-lock.yaml
          output-file: dist/frontend.spdx.json
          artifact-name: frontend.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # deploy-<sha> is immutable and is what Render is told to run; deploy-latest is only the blueprint's default.
      - name: Docker build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          context: .
          file: Dockerfile.distr
          push: true
          sbom: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:deploy-${{ github.sha }}
            ${{ env.IMAGE }}:deploy-latest
          labels: |
            org.opencontainers.image.description=Distr (Zapier-codes fleet front door)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy hook URL is a secret (RENDER_DEPLOY_HOOK_URL). Unset means "image published, nothing deployed
      # yet", which is the state before the Render service exists, so it is a notice, not a failure.
      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set, image published but not deployed."
            exit 0
          fi
          img="${IMAGE}:deploy-${GITHUB_SHA}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --get --data-urlencode "imgURL=${img}" "$HOOK")
          echo "Render deploy hook answered ${code}"
          case "$code" in 2*) ;; *) echo "::error::Render deploy hook refused the request"; exit 1 ;; esac
