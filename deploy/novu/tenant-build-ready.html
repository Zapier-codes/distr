<!--
  Body of the Novu email step of the "tenant-build-ready" workflow (leaf f.v). Paste it into the step's custom HTML
  editor. Distr triggers the workflow with the payload fields appName and downloadUrl, and nothing else: the mail has
  a single button, and never carries a file or a GitHub link.
  Suggested subject: Your {{payload.appName}} app is ready
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1f2937;">
  <h1 style="font-size: 22px; margin: 0 0 16px;">Your app is ready</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 28px;">
    The build of <strong>{{payload.appName}}</strong> has finished. Download the app to your Android phone and open
    the file to install it.
  </p>
  <p style="text-align: center; margin: 0 0 28px;">
    <a href="{{payload.downloadUrl}}"
       style="display: inline-block; background: #111827; color: #ffffff; text-decoration: none; font-size: 18px;
              font-weight: bold; padding: 16px 40px; border-radius: 8px;">Download your app</a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #6b7280; margin: 0;">
    The link works for 30 days. If you did not ask for this app, you can ignore this email.
  </p>
</div>
