# Render Blueprint for distr, the public no-signup request front door (Storeapp Track f, leaf f.x).
#
# Isolation is the point of this file (operator decision, recorded in Storeapp's HANDOVER.md): own image, own Render
# service, own Postgres. It shares nothing with Zealot's service, database or image. The two cross-communicate only
# through the signed TenantConfig publish, never a shared table.
#
# Written, NOT applied, NOT deployed. Nothing here has been run against Render.
databases:
  - name: distr-db
    # Own managed Postgres. A free Render Postgres expires after 30 days, so this is a paid plan on purpose.
    plan: basic-256mb
    region: singapore
    databaseName: distr
    user: distr

services:
  - type: web
    name: distr-web
    # Render pulls a prebuilt image; .github/workflows/publish-ghcr.yaml builds it and calls this service's deploy
    # hook with an immutable imgURL. image.url is only the default for a manual dashboard deploy.
    runtime: image
    image:
      url: ghcr.io/zapier-codes/distr:deploy-latest
      # No creds block. This assumes the GHCR package is public. If it is private, create a Registry Credential in
      # Render first and only then add `creds: {fromRegistryCreds: {name: <that name>}}`.
    plan: starter
    region: singapore # same region as the database, so the connection stays on Render's private network
    healthCheckPath: /ready
    # autoDeploy has no effect on an image-backed service; deploys come from the workflow's deploy-hook call.
    envVars:
      # distr listens on :8080 (hard-coded in cmd/distr/cmd/serve.go). Render routes to $PORT.
      - key: PORT
        value: 8080

      # Database: this blueprint's own Postgres. Migrations run on boot (`serve` migrates by default).
      - key: DATABASE_URL
        fromDatabase:
          name: distr-db
          property: connectionString

      # Secrets that must NOT be generated by the blueprint: losing DATABASE_ENCRYPTION_KEY makes encrypted rows
      # unreadable, and a re-sync must never replace either value. Generate each once with `openssl rand -base64 32`.
      - key: DATABASE_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

      # The public https origin, no path, e.g. https://distr.example.com. Used for links in mail and for logo URLs.
      - key: DISTR_HOST
        sync: false

      # Required by distr at start-up even though nothing in the request flow uses Loki. See deploy/render/README.md.
      - key: LOKI_URL
        value: http://localhost:3100

      # Object storage: not used. See deploy/render/README.md ("Object storage").
      - key: REGISTRY_ENABLED
        value: false

      # Request flow (f.i - f.v). All sync: false so a re-sync never overwrites what is set in the dashboard.
      - key: STOREAPP_BUILD_REPOSITORY
        sync: false # owner/name, defaults to Zapier-codes/Storeapp when unset
      - key: STOREAPP_BUILD_GITHUB_TOKEN
        sync: false # fine-grained: Actions read/write + Contents read, on the one repository
      - key: STOREAPP_BUILD_CONFIG_TOKEN
        sync: false # >= 32 chars; the same value as Storeapp's STOREAPP_BUILD_CONFIG_TOKEN repository secret
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: NOVU_API_KEY
        sync: false # distr's OWN Novu instance (f.xi, runbook in deploy/novu/README.md), not Zealot's
      - key: NOVU_API_URL
        sync: false
      - key: NOVU_BUILD_READY_WORKFLOW_ID
        sync: false
